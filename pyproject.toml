[project]
name = "amp-monorepo"
version = "0.1.0"
description = "Agent Managed Platform monorepo development tools"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[tool.uv.workspace]
members = ["services/*", "agents/*", "packages/*"]

[tool.uv.sources]
amp-common = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests", "services", "agents", "packages"]
pythonpath = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "agents", "packages", "tools", "tests"]
exclude = ["templates"]

[project]
name = "amp-agent"
version = "0.1.0"
description = "AMP Agent local com LangGraph, Ollama e FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

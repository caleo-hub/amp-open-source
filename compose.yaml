services:
  amp-db:
    image: postgres:16-alpine
    container_name: amp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amp
      POSTGRES_USER: amp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - amp_pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp"]
      interval: 5s
      timeout: 5s
      retries: 12

  amp-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "amp_agent.migrations_runner"]
    environment:
      PYTHONUNBUFFERED: "1"
      AMP_DB_HOST: amp-db
      AMP_DB_PORT: "5432"
      AMP_DB_NAME: amp
      AMP_DB_USER: amp
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      amp-db:
        condition: service_healthy

  amp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-api
    network_mode: host
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://localhost:11434"
      AMP_DB_HOST: "127.0.0.1"
      AMP_DB_PORT: "55432"
      AMP_DB_NAME: "amp"
      AMP_DB_USER: "amp"
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - source: amp_voice_api_key
        target: amp_voice_api_key
    depends_on:
      amp-db:
        condition: service_healthy
      amp-migrate:
        condition: service_completed_successfully

  amp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-worker
    network_mode: host
    restart: unless-stopped
    command: ["python", "-m", "amp_agent.worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://localhost:11434"
      AMP_DB_HOST: "127.0.0.1"
      AMP_DB_PORT: "55432"
      AMP_DB_NAME: "amp"
      AMP_DB_USER: "amp"
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      amp-db:
        condition: service_healthy
      amp-migrate:
        condition: service_completed_successfully

volumes:
  amp_pgdata:

secrets:
  amp_voice_api_key:
    file: ./secrets/amp_voice_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

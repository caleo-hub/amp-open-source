services:
  amp-db:
    image: postgres:16-alpine
    container_name: amp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amp
      POSTGRES_USER: amp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - amp_pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp"]
      interval: 5s
      timeout: 5s
      retries: 12

  amp-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "amp_agent.persistence.migrations_runner"]
    environment:
      PYTHONUNBUFFERED: "1"
      AMP_DB_HOST: amp-db
      AMP_DB_PORT: "5432"
      AMP_DB_NAME: amp
      AMP_DB_USER: amp
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      amp-db:
        condition: service_healthy

  amp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-api
    network_mode: host
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://localhost:11434"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888"
      WEB_SEARCH_TIMEOUT_SECONDS: "8"
      WEB_SEARCH_MAX_RESULTS: "5"
      WEB_SEARCH_MAX_SNIPPET_CHARS: "500"
      AMP_DB_HOST: "127.0.0.1"
      AMP_DB_PORT: "55432"
      AMP_DB_NAME: "amp"
      AMP_DB_USER: "amp"
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - source: amp_voice_api_key
        target: amp_voice_api_key
    depends_on:
      amp-db:
        condition: service_healthy
      amp-migrate:
        condition: service_completed_successfully

  amp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-worker
    network_mode: host
    restart: unless-stopped
    command: ["python", "-m", "amp_agent.worker.runner"]
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://localhost:11434"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888"
      WEB_SEARCH_TIMEOUT_SECONDS: "8"
      WEB_SEARCH_MAX_RESULTS: "5"
      WEB_SEARCH_MAX_SNIPPET_CHARS: "500"
      AMP_DB_HOST: "127.0.0.1"
      AMP_DB_PORT: "55432"
      AMP_DB_NAME: "amp"
      AMP_DB_USER: "amp"
      AMP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      amp-db:
        condition: service_healthy
      amp-migrate:
        condition: service_completed_successfully

  amp-iot-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-iot-bridge
    network_mode: host
    restart: unless-stopped
    command: ["python", "-m", "amp_agent.integrations.aws_iot.bridge"]
    environment:
      PYTHONUNBUFFERED: "1"
      IOT_ENDPOINT: "a11ogvst1mo5zr-ats.iot.us-east-1.amazonaws.com"
      IOT_CA: "/run/secrets/iot/AmazonRootCA1.pem"
      IOT_CERT: "/run/secrets/iot/device-certificate.pem.crt"
      IOT_KEY: "/run/secrets/iot/device-private.pem.key"
      IOT_CLIENT_ID: "amp-ubuntu"
      IOT_COMMAND_TOPIC: "amp/ubuntu/command"
      IOT_RESPONSE_PREFIX: "amp/ubuntu/response"
      AMP_VOICE_URL: "http://127.0.0.1:8000/voice"
      AMP_VOICE_RESULT_URL: "http://127.0.0.1:8000/voice/executions"
      AMP_VOICE_SECRET_PATH: "/run/secrets/amp_voice_api_key"
    volumes:
      - ./secrets/iot/AmazonRootCA1.pem:/run/secrets/iot/AmazonRootCA1.pem:ro
      - ./secrets/iot/cc2240010c1f360268e87b9adfea69e78c1b6fa70db153d4a93ac04b33e9bdb5-certificate.pem.crt:/run/secrets/iot/device-certificate.pem.crt:ro
      - ./secrets/iot/cc2240010c1f360268e87b9adfea69e78c1b6fa70db153d4a93ac04b33e9bdb5-private.pem.key:/run/secrets/iot/device-private.pem.key:ro
    secrets:
      - amp_voice_api_key
    depends_on:
      amp-api:
        condition: service_started

  amp-searxng:
    image: docker.io/searxng/searxng:latest
    container_name: amp-searxng
    restart: unless-stopped
    env_file:
      - ./secrets/searxng.env
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
volumes:
  amp_pgdata:

secrets:
  amp_voice_api_key:
    file: ./secrets/amp_voice_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

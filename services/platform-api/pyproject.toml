[project]
name = "amp-platform-api"
version = "0.1.0"
description = "AMP control-plane API"
requires-python = ">=3.12"
dependencies = [
  "amp-common",
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.0",
  "uvicorn[standard]>=0.35.0",
]

[tool.uv.sources]
amp-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
